<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>ABOUT | ユキツバキ</title>


    <style>


        /* =========================
           全体
        ========================= */

        body {

            background-color: #F7F0E3;

            color: #A83A3A;

            margin: 0;

            font-family: serif;
        }



        /* =========================
           ページタイトル
        ========================= */

        h1 {

            text-align: center;

            margin-top: 100px;

            font-size: 36px;

            font-weight: normal;

            letter-spacing: 0.15em;
        }



        /* =========================
           HOMEへ戻る
        ========================= */

        .back {

            text-align: center;

            margin-top: 25px;
        }


        .back a,
        .back a:visited {

            color: #A83A3A;

            text-decoration: none;

            font-size: 14px;

            letter-spacing: 0.1em;
        }


        .back a:hover {

            color: #23483A;
        }



        /* =========================
           ABOUT全体
        ========================= */

        .about {

            max-width: 700px;

            margin: 90px auto 150px;

            padding: 0 30px;
        }



        /* =========================
           プロフィール
        ========================= */

        .profile {

            text-align: center;

            padding: 50px 30px;

            border-top: 1px solid #A83A3A;

            border-bottom: 1px solid #A83A3A;
        }



        /* =========================
           ロゴ
        ========================= */

        .profile-mark {

            width: 100px;

            height: 100px;

            margin: 0 auto 30px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .profile-mark img {

            width: 100%;

            height: auto;
        }



        /* =========================
           名前
        ========================= */

        .name {

            font-size: 28px;

            letter-spacing: 0.15em;

            margin-bottom: 20px;
        }



        /* =========================
           プロフィール説明
        ========================= */

        .description {

            color: #23483A;

            font-size: 15px;

            line-height: 2;
        }



        /* =========================
           INFORMATION
        ========================= */

        .information {

            margin-top: 80px;
        }


        .information h2 {

            font-size: 18px;

            font-weight: normal;

            letter-spacing: 0.15em;

            padding-bottom: 12px;

            border-bottom: 1px solid #A83A3A;
        }


        .information p {

            color: #23483A;

            font-size: 15px;

            line-height: 2;
        }



        /* =========================
           ページ下部リンク
        ========================= */

        .bottom-menu {

            margin: 100px auto 50px;

            padding-top: 30px;

            border-top: 1px solid #A83A3A;

            text-align: center;
        }


        .bottom-menu a,
        .bottom-menu a:visited {

            display: inline-block;

            margin: 8px 15px;

            color: #A83A3A;

            text-decoration: none;

            font-size: 14px;

            letter-spacing: 0.1em;
        }


        .bottom-menu a:hover {

            color: #23483A;
        }



        /* =========================
           TOPへ戻る
        ========================= */

        .pagetop {

            display: block;

            width: fit-content;

            margin: 0 auto 50px;

            color: #A83A3A;

            text-decoration: none;

            font-size: 14px;

            letter-spacing: 0.1em;
        }


        .pagetop:visited {

            color: #A83A3A;
        }


        .pagetop:hover {

            color: #23483A;
        }

</head>
