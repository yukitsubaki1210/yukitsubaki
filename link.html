           リンクタイトル
        ========================= */

        /* =========================
           リンク
        ========================= */

        .link-item a,

            border-top: 1px solid #A83A3A;

        .bottom-menu a,
        .bottom-menu a:visited {

            display: inline-block;

            margin: 8px 15px;

            color: #A83A3A;

            text-decoration: none;

            font-size: 14px;

            letter-spacing: 0.1em;
        }


        .bottom-menu a:hover {

            color: #23483A;
        }



        /* =========================
           TOPへ戻る
        ========================= */

        .pagetop {

            display: block;

            width: fit-content;

            margin: 0 auto 50px;

            color: #A83A3A;

            text-decoration: none;

            font-size: 14px;

            letter-spacing: 0.1em;
        }


        .pagetop:visited {

        }


        .pagetop:hover {
