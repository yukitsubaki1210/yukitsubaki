<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>ユキツバキ</title>


    <style>


        /* =========================
           全体
        ========================= */

        body {

            background-color: #F7F0E3;

            color: #A83A3A;

            margin: 0;

            font-family: serif;
        }



        /* =========================
           ロゴ
        ========================= */

        .site-logo {

            text-align: center;

            margin-top: 90px;
        }


        .site-logo img {

            width: 120px;

            height: auto;

            display: block;

            margin: 0 auto;
        }



        /* =========================
           サイトタイトル
        ========================= */

        h1 {

            text-align: center;

            margin-top: 30px;

            font-size: 48px;

            font-weight: normal;

            letter-spacing: 0.15em;
        }



        /* =========================
           メニュー
        ========================= */

        nav {

            text-align: center;

            margin-top: 50px;
        }


        nav a,
        nav a:visited {

            color: #A83A3A;

            text-decoration: none;

            margin: 0 18px;

            font-size: 15px;

            letter-spacing: 0.1em;
        }


        nav a:hover {

            color: #23483A;
        }



        /* =========================
           各セクション
        ========================= */

        section {

            max-width: 900px;

            margin: 120px auto 0;

            padding: 0 30px;
        }



        /* =========================
           セクションタイトル
        ========================= */

        h2 {

            color: #A83A3A;

            font-size: 20px;

            font-weight: normal;

            letter-spacing: 0.15em;

            border-bottom: 1px solid #A83A3A;

            padding-bottom: 12px;
        }



        /* =========================
           NEWS
        ========================= */

        .news p {

            color: #23483A;

            font-size: 15px;

            margin-top: 25px;

            line-height: 2;
        }


        .news span {

            margin-right: 25px;
        }


        .news a,
        .news a:visited {

            color: #A83A3A;

            text-decoration: none;
        }


        .news a:hover {

            color: #23483A;
        }



        /* =========================
           NEW ILLUSTRATION
        ========================= */

        .works {

            display: flex;

            gap: 25px;

            margin-top: 30px;
        }


        .work {

            flex: 1;

            text-align: center;
        }


        .work img {

            width: 50%;

            height: auto;

            display: block;

            margin: 0 auto;

            cursor: pointer;

            transition: opacity 0.2s;
        }


        .work img:hover {

            opacity: 0.8;
        }


        .work p {

            color: #A83A3A;

            font-size: 14px;

            margin-top: 12px;
        }



        /* =========================
           大きな画像を表示する画面
        ========================= */

        .modal {

            display: none;

            position: fixed;

            z-index: 1000;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            background-color: rgba(35, 72, 58, 0.85);

            align-items: center;

            justify-content: center;
        }


        .modal img {

            max-width: 90%;

            max-height: 90%;

            width: auto;

            height: auto;
        }


        .close {

            position: absolute;

            top: 25px;

            right: 40px;

            color: #F7F0E3;

            font-size: 40px;

            cursor: pointer;
        }


        .close:hover {

            color: #A83A3A;
        }



        /* =========================
           ページ下部リンク
        ========================= */

        .bottom-menu {

            margin: 120px auto 60px;

            padding-top: 30px;

            border-top: 1px solid #A83A3A;

            text-align: center;
        }


        .bottom-menu a,
        .bottom-menu a:visited {

            display: inline-block;

            margin: 8px 15px;

            color: #A83A3A;

            text-decoration: none;

            font-size: 14px;

            letter-spacing: 0.1em;
        }


        .bottom-menu a:hover {

            color: #23483A;
        }



        /* =========================
           TOPへ戻る
        ========================= */

        .pagetop {

            display: block;

            width: fit-content;

            margin: 0 auto 50px;

            color: #A83A3A;

            text-decoration: none;

            font-size: 14px;

            letter-spacing: 0.1em;
        }


        .pagetop:visited {

            color: #A83A3A;
        }


        .pagetop:hover {

            color: #23483A;
        }



    </style>

</head>



<body id="top">



    <!-- =========================
         ロゴ
    ========================= -->

    <div class="site-logo">

        <img
            src="logo.png"
            alt="ユキツバキ ロゴ"
        >

    </div>



    <!-- =========================
         サイトタイトル
    ========================= -->

    <h1>
        ユキツバキ
    </h1>



    <!-- =========================
         メニュー
    ========================= -->

    <nav>

        <a href="about.html">
            ABOUT
        </a>

        <a href="illustration.html">
            ILLUSTRATION
        </a>

        <a href="comic.html">
            COMIC
        </a>

        <a href="diary.html">
            DIARY
        </a>

        <a href="event.html">
            EVENT
        </a>

        <a href="link.html">
            LINK
        </a>

    </nav>



    <!-- =========================
         NEWS
    ========================= -->

    <section class="news">

        <h2>
            NEWS
        </h2>


        <!-- COMICページ追加 -->

        <p>

            <span>
                2026.09.15
            </span>

            <a href="comic.html">
                COMICページを追加しました。
            </a>

        </p>


        <!-- EVENTページ更新 -->

        <p>

            <span>
                2026.09.14
            </span>

            <a href="event.html">
                EVENTページを更新しました。
            </a>

        </p>


        <!-- サイト開設 -->

        <p>

            <span>
                2026.09.12
            </span>

            サイトを開設しました。

        </p>

    </section>



    <!-- =========================
         NEW ILLUSTRATION
    ========================= -->

    <section class="illustration">

        <h2>
            NEW ILLUSTRATION
        </h2>


        <div class="works">



            <div class="work">

                <img
                    src="illustration01.png"
                    alt="作品1"
                    onclick="openModal(this.src)"
                >

                <p>
                    アカバ
                </p>

            </div>



            <div class="work">

                <img
                    src="vtuber01.png"
                    alt="作品2"
                    onclick="openModal(this.src)"
                >

                <p>
                    鳩乃はろん
                </p>

            </div>



            <div class="work">

                <img
                    src="copyright01.png"
                    alt="作品3"
                    onclick="openModal(this.src)"
                >

                <p>
                    ブラック
                </p>

            </div>



        </div>

    </section>



    <!-- =========================
         大きな画像を表示する部分
    ========================= -->

    <div
        class="modal"
        id="imageModal"
    >

        <span
            class="close"
            onclick="closeModal()"
        >
            ×
        </span>


        <img id="modalImage">

    </div>



    <!-- =========================
         JavaScript
    ========================= -->

    <script>


        function openModal(imageSrc) {

            document.getElementById("imageModal").style.display = "flex";

            document.getElementById("modalImage").src = imageSrc;

        }


        function closeModal() {

            document.getElementById("imageModal").style.display = "none";

        }


    </script>



    <!-- =========================
         ページ下部リンク
    ========================= -->

    <section class="bottom-menu">


        <a href="index.html">
            HOME
        </a>


        <a href="about.html">
            ABOUT
        </a>


        <a href="illustration.html">
            ILLUSTRATION
        </a>


        <a href="comic.html">
            COMIC
        </a>


        <a href="diary.html">
            DIARY
        </a>


        <a href="event.html">
            EVENT
        </a>


        <a href="link.html">
            LINK
        </a>


    </section>



    <!-- =========================
         ページ上部へ
    ========================= -->

    <a
        href="#top"
        class="pagetop"
    >
        ↑ TOP
    </a>



</body>

</html>
