        /* =========================
           全体
        ========================= */

        body {

            font-family: serif;
        }



        /* =========================
           ページタイトル
        ========================= */

        h1 {

            text-align: center;

            margin-top: 100px;

            font-size: 36px;

            font-weight: normal;

            letter-spacing: 0.15em;
        }



        /* =========================
           HOMEへ戻る
        ========================= */

        .back {

            text-align: center;

            margin-top: 25px;
        }


        .back a,
        .back a:visited {

            color: #A83A3A;

            text-decoration: none;

            font-size: 14px;

            letter-spacing: 0.1em;
        }


        .back a:hover {

        }



        /* =========================
           作品カテゴリー
        ========================= */

        .category {

            max-width: 900px;

            margin: 100px auto 0;

            padding: 0 30px;
        }



        /* =========================
           カテゴリータイトル
        ========================= */

        h2 {

            color: #A83A3A;

            font-size: 20px;

            font-weight: normal;

            letter-spacing: 0.15em;

            border-bottom: 1px solid #A83A3A;

            padding-bottom: 12px;
        }



        /* =========================
           作品を横並びにする
        ========================= */

        .works {

            display: flex;

            flex-wrap: wrap;

            gap: 30px;

            margin-top: 35px;
        }



        /* =========================
           作品1つ分
        ========================= */

        .work {

            width: calc(33.333% - 20px);

            text-align: center;

            box-sizing: border-box;
        }



        /* =========================
           作品画像
        ========================= */

        .work img {

            width: 70%;

            height: auto;

            display: block;

            margin: 0 auto;

            cursor: pointer;

            transition: opacity 0.2s;
        }


        .work img:hover {

            opacity: 0.8;
        }



        /* =========================
           作品タイトル
        ========================= */

        .work p {

            color: #A83A3A;

            font-size: 14px;

            margin-top: 12px;

            line-height: 1.6;

            white-space: normal;

            overflow-wrap: anywhere;
        }



        /* =========================
           ページ下部リンク
        ========================= */

        .links {

            margin: 120px auto 60px;

            padding-top: 30px;

            border-top: 1px solid #A83A3A;

            text-align: center;
        }


        .links a,
        .links a:visited {

            display: inline-block;

            margin: 8px 15px;

            color: #A83A3A;

            text-decoration: none;

            font-size: 14px;

            letter-spacing: 0.1em;
        }


        .links a:hover {

            color: #23483A;
        }



        /* =========================
           TOPへ戻る
        ========================= */

        .pagetop {

            display: block;

            width: fit-content;

            margin: 0 auto 50px;

            color: #A83A3A;

            text-decoration: none;

            font-size: 14px;

            letter-spacing: 0.1em;
        }


        .pagetop:visited {

            color: #A83A3A;
        }


        .pagetop:hover {

            color: #23483A;
        }



        /* =========================
           大きな画像を表示する画面
        ========================= */

        .modal {

            display: none;

            position: fixed;

            z-index: 1000;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            background-color: rgba(35, 72, 58, 0.85);

            align-items: center;

            justify-content: center;
        }



        /* =========================
           モーダルの中身
        ========================= */

        .modal-content {

            position: relative;

            width: 100%;

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;
        }



        /* =========================
           大きく表示する画像
        ========================= */

        .modal img {

            max-width: 75%;

            max-height: 85%;

            width: auto;

            height: auto;
        }



        /* =========================
           閉じるボタン
        ========================= */

        .close {

            position: absolute;

            top: 25px;

            right: 40px;

            color: #F7F0E3;

            font-size: 40px;

            cursor: pointer;

            z-index: 1002;
        }


        .close:hover {

            color: #A83A3A;
        }



        /* =========================
           前へ・次へボタン
        ========================= */

        .prev,
        .next {

            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            color: #F7F0E3;

            font-size: 45px;

            cursor: pointer;

            user-select: none;

            z-index: 1001;

            padding: 20px;
        }


        .prev {

            left: 20px;
        }


        .next {

            right: 20px;
        }


        .prev:hover,
        .next:hover {

            color: #A83A3A;
        }



        /* =========================
           スマートフォン対応
        ========================= */

        @media (max-width: 700px) {

            .category {

                padding: 0 20px;

            }


            .work {

                width: calc(50% - 15px);

            }


            .work img {

                width: 80%;

            }


            .modal img {

                max-width: 75%;

                max-height: 80%;

            }


            .prev,
            .next {

                font-size: 30px;

                padding: 10px;

            }


            .prev {

                left: 5px;

            }


            .next {

                right: 5px;

            }


            .close {

                top: 15px;

                right: 20px;

                font-size: 32px;

            }

        }



    </style>

    <!-- =========================
         JavaScript
    ========================= -->

    <script>


        /* =========================
           現在表示している作品
        ========================= */

        let currentIndex = 0;

        let currentCategory = "";

        let categoryImages = [];



        /* =========================
           画像を開く
        ========================= */

        function openModal(image, category) {

            currentCategory = category;


            /*
             * クリックした画像と同じ
             * カテゴリーに属する画像だけを取得
             */

            const works =
                document.querySelectorAll(
                    ".category"
                );


            categoryImages = [];


            works.forEach(function(section) {

                const title =
                    section.querySelector("h2").textContent.trim();


                if (
                    (category === "巻戻士" && title === "運命の巻戻士") ||
                    (category === "コロコロ" && title === "コロコロ") ||
                    (category === "VTuber" && title === "VTuber") ||
                    (category === "ORIGINAL" && title === "ORIGINAL")
                ) {

                    categoryImages =
                        Array.from(
                            section.querySelectorAll(".work img")
                        );

                }

            });


            currentIndex =
                categoryImages.indexOf(image);


            document.getElementById("imageModal").style.display = "flex";


            document.getElementById("modalImage").src =
                image.src;


            updateButtons();

        }



        /* =========================
           前の作品
           最初 → 最後へループ
        ========================= */

        function showPrevious() {

            if (categoryImages.length === 0) {

                return;

            }


            currentIndex--;


            if (currentIndex < 0) {

                currentIndex =
                    categoryImages.length - 1;

            }


            updateModalImage();

        }



        /* =========================
           次の作品
           最後 → 最初へループ
        ========================= */

        function showNext() {

            if (categoryImages.length === 0) {

                return;

            }


            currentIndex++;


            if (
                currentIndex >= categoryImages.length
            ) {

                currentIndex = 0;

            }


            updateModalImage();

        }



        /* =========================
           表示する画像を更新
        ========================= */

        function updateModalImage() {

            document.getElementById("modalImage").src =
                categoryImages[currentIndex].src;

        }



        /* =========================
           前へ・次へボタン
        ========================= */

        function updateButtons() {

            /*
             * ループ式なので、
             * 最初・最後でもボタンを消さない
             */

            document.querySelector(".prev").style.visibility =
                "visible";

            document.querySelector(".next").style.visibility =
                "visible";

        }



        /* =========================
           閉じる
        ========================= */

        function closeModal() {

            document.getElementById("imageModal").style.display =
                "none";

        }



        /* =========================
           キーボード操作
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {


                const modal =
                    document.getElementById("imageModal");


                if (
                    modal.style.display !== "flex"
                ) {

                    return;

                }


                if (
                    event.key === "ArrowLeft"
                ) {

                    showPrevious();

                }


                if (
                    event.key === "ArrowRight"
                ) {

                    showNext();

                }


                if (
                    event.key === "Escape"
                ) {

                    closeModal();

                }


            }
        );



        /* =========================
           背景をクリックして閉じる
        ========================= */

        document
            .getElementById("imageModal")
            .addEventListener(
                "click",
                function(event) {

                    if (
                        event.target === this
                    ) {

                        closeModal();

                    }

                }
            );


    </script>
