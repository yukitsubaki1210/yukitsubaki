    <style>

        /* =========================
           全体
        ========================= */

        body {
            background-color: #F7F0E3;
            color: #A83A3A;
            margin: 0;
            font-family: serif;
        }


        /* =========================
           ページタイトル
        ========================= */

        h1 {
            text-align: center;
            margin-top: 100px;
            font-size: 36px;
            font-weight: normal;
            letter-spacing: 0.15em;
        }


        /* =========================
           HOMEへ戻る
        ========================= */

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a,
        .back a:visited {
            color: #A83A3A;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.1em;
        }

        .back a:hover {
            color: #23483A;
        }


        /* =========================
           作品カテゴリー
        ========================= */

        .category {
            max-width: 900px;
            margin: 100px auto 0;
            padding: 0 30px;
        }


        /* カテゴリータイトル */

        h2 {
            color: #A83A3A;
            font-size: 20px;
            font-weight: normal;
            letter-spacing: 0.15em;

            border-bottom: 1px solid #A83A3A;

            padding-bottom: 12px;
        }


        /* =========================
           作品を横並びにする
        ========================= */

        .works {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;

            margin-top: 35px;
        }


        /* 作品1つ分 */

        .work {
            width: calc(33.333% - 20px);
            text-align: center;
        }


        /* 作品画像 */

        .work img {
            width: 70%;
            height: auto;

            display: block;
            margin: 0 auto;

            cursor: pointer;

            transition: opacity 0.2s;
        }


        /* マウスを乗せたとき */

        .work img:hover {
            opacity: 0.8;
        }


        /* 作品タイトル */

        .work p {
            color: #A83A3A;
            font-size: 14px;
            margin-top: 12px;
        }


        /* =========================
           ページ下部リンク
        ========================= */

        .links {
            margin: 120px auto 60px;

            padding-top: 30px;

            border-top: 1px solid #A83A3A;

            text-align: center;
        }


        .links a,
        .links a:visited {
            display: inline-block;

            margin: 8px 15px;

            color: #A83A3A;

            text-decoration: none;

            font-size: 14px;

            letter-spacing: 0.1em;
        }


        /* マウスを乗せたとき */

        .links a:hover {
            color: #23483A;
        }


        /* =========================
           TOPへ戻る
        ========================= */

        .pagetop {
            display: block;

            width: fit-content;

            margin: 0 auto 50px;

            color: #A83A3A;

            text-decoration: none;

            font-size: 14px;

            letter-spacing: 0.1em;
        }


        .pagetop:visited {
            color: #A83A3A;
        }


        .pagetop:hover {
            color: #23483A;
        }


        /* =========================
           大きな画像を表示する画面
        ========================= */

        .modal {

            display: none;

            position: fixed;

            z-index: 1000;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background-color: rgba(35, 72, 58, 0.85);

            align-items: center;
            justify-content: center;
        }


        /* 大きく表示する画像 */

        .modal img {

            max-width: 90%;
            max-height: 90%;

            width: auto;
            height: auto;
        }


        /* 閉じるボタン */

        .close {

            position: absolute;

            top: 25px;
            right: 40px;

            color: #F7F0E3;

            font-size: 40px;

            cursor: pointer;
        }


        .close:hover {
            color: #A83A3A;
        }


    </style>

</head>
