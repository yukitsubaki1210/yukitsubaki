<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COMIC | ユキツバキ</title>

    <style>
        /* 全体 */
        body {
            background-color: #F7F0E3;
            color: #A83A3A;
            margin: 0;
            font-family: serif;
        }

        /* ページタイトル */
        h1 {
            text-align: center;
            margin-top: 100px;
            font-size: 36px;
            font-weight: normal;
            letter-spacing: 0.15em;
        }

        /* HOMEへ戻る */
        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a,
        .back a:visited {
            color: #A83A3A;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.1em;
        }

        .back a:hover {
            color: #23483A;
        }

        /* 漫画一覧 */
        .comics {
            max-width: 900px;
            margin: 100px auto 150px;
            padding: 0 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 50px 30px;
        }

        /* 漫画1作品 */
        .comic {
            width: calc(33.333% - 20px);
            text-align: center;
            box-sizing: border-box;
        }

        /* 表紙 */
        .comic img {
            width: 80%;
            height: auto;
            display: block;
            margin: 0 auto;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .comic img:hover {
            opacity: 0.8;
        }

        /* 漫画タイトル */
        .comic p {
            color: #A83A3A;
            font-size: 15px;
            margin-top: 15px;
            line-height: 1.6;
        }

        /* 漫画ビューア */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(35, 72, 58, 0.92);
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: pan-y;
        }

        /* ビューア内部 */
        .modal-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 漫画ページ */
        .modal img {
            max-width: 75%;
            max-height: 88%;
            width: auto;
            height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            transition: transform 0.25s ease;
        }

        /* 閉じるボタン */
        .close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: #F7F0E3;
            font-size: 40px;
            cursor: pointer;
            z-index: 1002;
        }

        .close:hover {
            color: #A83A3A;
        }

        /* 前へ・次へ */
        .prev,
        .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #F7F0E3;
            font-size: 50px;
            cursor: pointer;
            user-select: none;
            z-index: 1001;
            padding: 20px;
        }

        .prev {
            left: 20px;
        }

        .next {
            right: 20px;
        }

        .prev:hover,
        .next:hover {
            color: #A83A3A;
        }

        /* ページ番号 */
        .page-number {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #F7F0E3;
            font-size: 13px;
            letter-spacing: 0.1em;
        }

        /* 最初のページに戻る：右下の四角い案内ボタン */
        .return-first {
            display: none;
            position: absolute;
            bottom: 25px;
            right: 30px;
            left: auto;
            transform: none;
            padding: 12px 24px;
            border: 1px solid #F7F0E3;
            border-radius: 0;
            background-color: transparent;
            color: #F7F0E3;
            text-decoration: none;
            font-family: serif;
            font-size: 14px;
            letter-spacing: 0.08em;
            white-space: nowrap;
            cursor: pointer;
            z-index: 1002;
            transition: 0.3s;
            box-sizing: border-box;
            appearance: none;
            -webkit-appearance: none;
        }

        /* カーソルを合わせた時：赤い背景＋クリーム色の文字 */
.return-first:hover {
    background-color: transparent;
    border-color: #A83A3A;
    color: #A83A3A;
}

        /* キーボード操作時のフォーカス */
        .return-first:focus-visible {
            outline: 2px solid #F7F0E3;
            outline-offset: 4px;
        }

        /* ページ下部リンク */
        .links {
            margin: 120px auto 60px;
            padding-top: 30px;
            border-top: 1px solid #A83A3A;
            text-align: center;
        }

        .links a,
        .links a:visited {
            display: inline-block;
            margin: 8px 15px;
            color: #A83A3A;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.1em;
        }

        .links a:hover {
            color: #23483A;
        }

        /* TOPへ戻る */
        .pagetop {
            display: block;
            width: fit-content;
            margin: 0 auto 50px;
            color: #A83A3A;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.1em;
        }

        .pagetop:visited {
            color: #A83A3A;
        }

        .pagetop:hover {
            color: #23483A;
        }

        /* スマートフォン対応 */
        @media (max-width: 700px) {
            .comics {
                padding: 0 20px;
                gap: 40px 20px;
            }

            .comic {
                width: calc(50% - 10px);
            }

            .comic img {
                width: 90%;
            }

            .modal img {
                max-width: 78%;
                max-height: 78%;
            }

            .prev,
            .next {
                font-size: 32px;
                padding: 10px;
            }

            .prev {
                left: 5px;
            }

            .next {
                right: 5px;
            }

            .close {
                top: 15px;
                right: 20px;
                font-size: 32px;
            }

            .return-first {
                bottom: 20px;
                right: 15px;
                left: auto;
                transform: none;
                padding: 10px 14px;
                font-size: 12px;
            }

            .page-number {
                bottom: 25px;
            }
        }
    </style>
</head>

<body id="top">

    <!-- ページタイトル -->
    <h1>COMIC</h1>

    <!-- HOMEへ戻る -->
    <div class="back">
        <a href="index.html">← HOME</a>
    </div>

    <!-- 漫画一覧 -->
    <main class="comics">

        <!-- 漫画2 -->
        <div class="comic">
            <img
                src="comic02-cover.png"
                alt="漫画作品2 表紙"
                onclick="openComic(1)"
            >

            <p>これまでも、これからも。</p>
        </div>

        <!-- 漫画1 -->
        <div class="comic">
            <img
                src="comic01-cover.png"
                alt="漫画作品1 表紙"
                onclick="openComic(0)"
            >

            <p>きれいな手のはなし</p>
        </div>

    </main>

    <!-- 漫画ビューア -->
    <div class="modal" id="comicModal">

        <div class="modal-content">

            <!-- 閉じる -->
            <span
                class="close"
                onclick="closeComic()"
                aria-label="閉じる"
            >×</span>

            <!-- 前のページ -->
            <span
                class="prev"
                id="prevButton"
                onclick="previousPage()"
                aria-label="前のページ"
            >‹</span>

            <!-- 漫画ページ -->
            <img
                id="comicImage"
                src=""
                alt="漫画ページ"
            >

            <!-- 次のページ -->
            <span
                class="next"
                id="nextButton"
                onclick="nextPage()"
                aria-label="次のページ"
            >›</span>

            <!-- 最初のページに戻るボタン -->
            <button
                type="button"
                class="return-first"
                id="returnFirst"
                onclick="returnToFirstPage()"
            >最初のページに戻る</button>

            <!-- ページ番号 -->
            <div
                class="page-number"
                id="pageNumber"
            ></div>

        </div>
    </div>

    <!-- JavaScript -->
    <script>
        /* 漫画データ */
        const comics = [
            {
                title: "きれいな手のはなし",
                pages: [
　　　　　　　　　　　　"comic01-cover.png",
                    "comic01-01.png",
                    "comic01-02.png",
                    "comic01-03.png",
                    "comic01-04.png",
                    "comic01-05.png",
                    "comic01-06.png",
                    "comic01-07.png"
                ]
            },
            {
                title: "これまでも、これからも。",
                pages: [
                    "comic02-cover.png",
                    "comic02-01.png",
                ]
            }
        ];

        /* 現在の漫画・ページ */
        let currentComic = 0;
        let currentPage = 0;

        /* 漫画を開く */
        function openComic(comicIndex) {
            currentComic = comicIndex;
            currentPage = 0;

            document.getElementById("comicModal").style.display = "flex";
            updateComicPage();
        }

        /* ページ表示を更新 */
        function updateComicPage() {
            const comic = comics[currentComic];

            document.getElementById("comicImage").src =
                comic.pages[currentPage];

            document.getElementById("pageNumber").textContent =
                (currentPage + 1) + " / " + comic.pages.length;

            const isFirstPage = currentPage === 0;
            const isLastPage = currentPage === comic.pages.length - 1;

            /* 最初のページでは「前へ」を隠す */
            document.getElementById("prevButton").style.display =
                isFirstPage ? "none" : "block";

            /* 最終ページでは「次へ」を隠す */
            document.getElementById("nextButton").style.display =
                isLastPage ? "none" : "block";

            /* 最終ページだけ戻るボタンを表示 */
            document.getElementById("returnFirst").style.display =
                isLastPage ? "block" : "none";
        }

        /* 前のページ */
        function previousPage() {
            if (currentPage > 0) {
                currentPage--;
                updateComicPage();
            }
        }

        /* 次のページ */
        function nextPage() {
            const comic = comics[currentComic];

            if (currentPage < comic.pages.length - 1) {
                currentPage++;
                updateComicPage();
            }
        }

        /* 最初のページに戻る */
        function returnToFirstPage() {
            currentPage = 0;
            updateComicPage();
        }

        /* 閉じる */
        function closeComic() {
            document.getElementById("comicModal").style.display = "none";
        }

        /* キーボード操作 */
        document.addEventListener("keydown", function(event) {
            const modal = document.getElementById("comicModal");

            if (modal.style.display !== "flex") {
                return;
            }

            if (event.key === "ArrowLeft") {
                previousPage();
            }

            if (event.key === "ArrowRight") {
                nextPage();
            }

            if (event.key === "Escape") {
                closeComic();
            }
        });

        /* 背景クリックで閉じる */
        document.getElementById("comicModal").addEventListener(
            "click",
            function(event) {
                if (event.target === this) {
                    closeComic();
                }
            }
        );

        /* スワイプ操作 */
        let startX = 0;
        let startY = 0;

        document.getElementById("comicModal").addEventListener(
            "touchstart",
            function(event) {
                startX = event.touches[0].clientX;
                startY = event.touches[0].clientY;
            },
            { passive: true }
        );

        document.getElementById("comicModal").addEventListener(
            "touchend",
            function(event) {
                const endX = event.changedTouches[0].clientX;
                const endY = event.changedTouches[0].clientY;

                const distanceX = endX - startX;
                const distanceY = endY - startY;

                if (
                    Math.abs(distanceX) > 50 &&
                    Math.abs(distanceX) > Math.abs(distanceY)
                ) {
                    if (distanceX < 0) {
                        nextPage();
                    } else {
                        previousPage();
                    }
                }
            },
            { passive: true }
        );

        /* マウスドラッグ操作 */
        let isDragging = false;

        document.getElementById("comicModal").addEventListener(
            "mousedown",
            function(event) {
                if (event.target.closest("button, .close, .prev, .next")) {
                    return;
                }

                startX = event.clientX;
                startY = event.clientY;
                isDragging = true;
            }
        );

        document.getElementById("comicModal").addEventListener(
            "mouseup",
            function(event) {
                if (!isDragging) {
                    return;
                }

                const endX = event.clientX;
                const endY = event.clientY;

                const distanceX = endX - startX;
                const distanceY = endY - startY;

                isDragging = false;

                if (
                    Math.abs(distanceX) > 50 &&
                    Math.abs(distanceX) > Math.abs(distanceY)
                ) {
                    if (distanceX < 0) {
                        nextPage();
                    } else {
                        previousPage();
                    }
                }
            }
        );

        /* マウスが画面外で離された場合の誤動作を防止 */
        document.addEventListener("mouseup", function() {
            isDragging = false;
        });
    </script>

    <!-- ページ下部リンク -->
    <section class="links">
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="illustration.html">ILLUSTRATION</a>
        <a href="comic.html">COMIC</a>
        <a href="diary.html">DIARY</a>
        <a href="event.html">EVENT</a>
    </section>

    <!-- ページ上部へ -->
    <a href="#top" class="pagetop">↑ TOP</a>

</body>
</html>
